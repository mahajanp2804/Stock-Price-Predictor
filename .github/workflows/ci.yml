name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Real MySQL for the database tests (src/test/java/com/capstone/db/*DbTest)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and package
        run: mvn -B clean verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stockdb_test?createDatabaseIfNotExist=true
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: stock-trading-app
          path: target/stock-trading-app.jar
