# -------------------------------------------------------
# Application configuration template
# Copy this file to config.properties (same folder) and fill in your values.
# config.properties is git-ignored — never commit real keys.
#
# Every value can also be set as an environment variable, which takes
# precedence over this file: upper-case the key and replace '.' with '_'
#   finnhub.key -> FINNHUB_KEY,  db.password -> DB_PASSWORD
# -------------------------------------------------------

# --- API keys (get free keys at each provider's site) ---
# Primary:   finnhub.io        — 60 calls/min, ~15 min delay
# Fallback1: twelvedata.com    — 800 calls/day, 4hr delay
# Fallback2: alphavantage.co   — 25 calls/day,  15 min delay
# Leave a key blank to skip that provider

finnhub.key=
twelvedata.key=
alphavantage.key=

# --- MySQL connection ---
db.url=jdbc:mysql://localhost:3306/stockdb
db.user=root
db.password=
